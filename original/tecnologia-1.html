<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Tecnología en Primero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Noto+Color+Emoji&display=swap">
<style>
/* Layout: una pantalla fija, barra superior con menú hamburguesa, el juego ocupa todo lo demás */
:root{
  --bg:#EDE8FF; --ink:#23204A; --card:#FFFFFF; --soft:#D9D1FF;
  --robot:#FF6B4A; --reci:#22A866; --dibu:#2F80ED; --luz:#FFB800;
  --ok:#22A866; --bad:#E5484D;
  --display:"Baloo 2","Trebuchet MS",Arial,Helvetica,"Liberation Sans","Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--display);text-transform:uppercase;overflow-x:hidden;overflow-y:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box;
  user-select:none;-webkit-user-select:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font-family:inherit;text-transform:uppercase;color:var(--ink);cursor:pointer;border:0}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
#app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:16px;padding-block:12px;min-height:84px}
.burger{width:64px;height:64px;border-radius:18px;background:var(--card);display:grid;place-items:center;box-shadow:0 4px 0 var(--soft);flex:none}
.burger span{display:block;width:30px;height:5px;border-radius:3px;background:var(--ink);box-shadow:0 10px 0 var(--ink),0 -10px 0 var(--ink)}
.bar h1{margin:0;font-size:clamp(28px,4.5vh,48px);font-weight:800;letter-spacing:.04em;line-height:1;flex:1;min-width:0}
.dots{display:flex;gap:10px;align-items:center}
.dots i{width:22px;height:22px;border-radius:50%;background:var(--soft)}
.dots i.on{background:var(--c,var(--ink))}
.chip{background:var(--ink);color:#fff;border-radius:999px;padding:6px 18px;font-size:24px;font-weight:800;letter-spacing:.06em}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding-bottom:16px;position:relative}

/* inicio */
.home{--gap:clamp(12px,2.2vh,24px);display:flex;flex-wrap:wrap;justify-content:center;align-content:stretch;gap:var(--gap);width:min(100%,1200px);height:100%;max-height:820px}
.home .tile{flex:0 0 calc((100% - 4 * var(--gap)) / 5);height:calc((100% - 2 * var(--gap)) / 3);text-align:center;line-height:1.05;padding:0 8px}
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:15;width:84px;height:84px;border-radius:50%;background:var(--ink);font-size:42px;line-height:1;display:grid;place-items:center;box-shadow:0 6px 0 rgba(35,32,74,.3)}
.fab:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(35,32,74,.3)}
.tile{border-radius:30px;background:var(--c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;
  box-shadow:0 8px 0 rgba(35,32,74,.18);transition:transform .15s;color:#fff;font-weight:800;font-size:clamp(17px,2.8vh,32px);letter-spacing:.02em}
.tile{position:relative}
.recy{display:inline-block;vertical-align:-.14em}
.tile .ico .recy{display:block;margin:0 auto;width:1em;height:1em}
.badge{position:absolute;top:6px;right:10px;font-size:clamp(30px,5.5vh,54px);line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;filter:drop-shadow(0 3px 0 rgba(35,32,74,.3));animation:pop .6s}
.tile:hover{transform:translateY(-4px) rotate(-1deg)}
.tile .ico{font-size:clamp(36px,7vh,92px);line-height:1;display:block;width:100%;text-align:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.bin .bi,.item,.opt,.cell,.seq b{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",var(--display)}
.tile.g-luz{color:var(--ink)}

/* menú */
.scrim{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(35,32,74,.45);z-index:20}
.menu{position:fixed;top:0;left:0;bottom:0;width:min(420px,92vw);background:var(--card);z-index:21;overflow:auto;
  padding:calc(20px + env(safe-area-inset-top,0px)) 24px calc(20px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:18px}
.menu h2{margin:8px 0 0;font-size:20px;letter-spacing:.12em;opacity:.6}
.menu .row{display:flex;flex-wrap:wrap;gap:10px}
.mbtn{background:var(--bg);border-radius:16px;padding:12px 18px;font-size:24px;font-weight:800;display:flex;align-items:center;gap:10px}
.mbtn.big{width:100%}
.mbtn.sel{background:var(--ink);color:#fff}
.lvl{width:64px;height:64px;justify-content:center;font-size:30px;padding:0}
.close{align-self:flex-end;width:56px;height:56px;border-radius:50%;background:var(--bg);font-size:30px;font-weight:800}

/* comunes */
.big-btn{border-radius:24px;font-weight:800;font-size:clamp(26px,4vh,40px);padding:12px 26px;background:var(--card);box-shadow:0 6px 0 var(--soft)}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--soft)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-12px)}40%,80%{transform:translateX(12px)}}
.pop{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.15)}}

/* robot */
.robot{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;height:100%}
.grid{display:grid;gap:6px;background:var(--soft);padding:6px;border-radius:24px}
.cell{width:var(--cell);height:var(--cell);border-radius:14px;background:var(--card);display:grid;place-items:center;font-size:calc(var(--cell)*.62);line-height:1}
.editing .cell{cursor:pointer}
.ctrl{display:flex;flex-direction:column;gap:16px;align-items:center}
.tools{display:flex;gap:10px}
.tools button{width:calc(var(--btn)*.85);height:calc(var(--btn)*.85);border-radius:18px;background:var(--card);font-size:calc(var(--btn)*.5);box-shadow:0 5px 0 var(--soft);border:5px solid transparent}
.tools button.sel{border-color:var(--ink)}
.arrows{display:grid;grid-template-columns:repeat(3,var(--btn));grid-template-rows:repeat(3,var(--btn));gap:10px}
.arrows button{border-radius:20px;background:var(--robot);color:#fff;font-size:calc(var(--btn)*.55);font-weight:800;box-shadow:0 6px 0 #C9472C}
.arrows button:active{transform:translateY(4px);box-shadow:0 2px 0 #C9472C}
.seq{display:flex;flex-wrap:wrap;gap:8px;background:var(--card);border-radius:20px;padding:10px;min-height:calc(var(--btn)*.6 + 20px);width:calc(var(--btn)*3 + 20px + 120px);max-width:100%;align-content:flex-start}
.seq b{width:calc(var(--btn)*.6);height:calc(var(--btn)*.6);border-radius:12px;background:var(--robot);color:#fff;display:grid;place-items:center;font-size:calc(var(--btn)*.38)}
.seq b.now{background:var(--ink)}
.go{display:flex;gap:12px}
.go .run{background:var(--ok);color:#fff;box-shadow:0 6px 0 #17804C}

/* reciclaje */
.reci{display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:100%;width:100%;gap:16px}
.item{font-size:min(26vh,200px);line-height:1;background:var(--card);border-radius:40px;padding:20px 40px;box-shadow:0 8px 0 var(--soft)}
.prog{display:flex;gap:8px}
.prog i{width:18px;height:18px;border-radius:50%;background:var(--soft)}
.prog i.on{background:var(--reci)}
.bins{display:flex;gap:clamp(12px,2vw,28px);justify-content:center;flex-wrap:wrap;width:100%}
.bin{width:clamp(130px,19vw,240px);aspect-ratio:1/1.05;max-width:100%;border-radius:22px 22px 40px 40px;background:var(--c);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:clamp(20px,2.6vh,30px);font-weight:800;box-shadow:0 8px 0 rgba(35,32,74,.25);position:relative;padding-top:18px}
.bin::before{content:"";position:absolute;top:-14px;left:-6px;right:-6px;height:26px;border-radius:12px;background:var(--c);filter:brightness(.82)}
.bin .bi{font-size:clamp(44px,7vh,80px);line-height:1}
.bin.ama{color:var(--ink)}

/* dibujo */
.dibu{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;height:100%}
.model{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:24px;font-weight:800}
.model .grid{gap:3px;padding:4px;border-radius:14px}
.model .cell{border-radius:5px}
.paint{touch-action:none}
.paint .cell{cursor:pointer;border-radius:10px}
.paint.fine{gap:2px;padding:4px;border-radius:12px}
.paint.fine .cell{border-radius:3px}
.pal{display:flex;flex-direction:column;gap:12px}
.pal.two{display:grid;grid-template-columns:repeat(2,var(--btn))}
.pal button{width:var(--btn);height:var(--btn);border-radius:50%;box-shadow:0 5px 0 rgba(35,32,74,.2);border:6px solid transparent}
.pal button.sel{border-color:var(--ink);transform:scale(1.08)}
.pal .eraser{background:var(--card);font-size:calc(var(--btn)*.45)}

/* luz */
.luz{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
.luz svg{touch-action:none;background:var(--card);border-radius:30px;box-shadow:0 8px 0 var(--soft);max-width:100%;height:auto}
.term{cursor:pointer}
.sw{cursor:pointer}
.wclick{cursor:pointer}

/* laberinto */
.maze{position:relative;border-radius:14px;overflow:hidden;touch-action:none;box-shadow:0 8px 0 var(--soft);cursor:pointer}
.maze > div{position:absolute;width:var(--cell);height:var(--cell);background:var(--card);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:calc(var(--cell)*.68);line-height:1;font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif}
.maze .w{background:var(--ink)}
.maze .p{background:#FFE9A0}
.maze.lit .p{background:var(--luz)}
.maze.lit .goal{filter:drop-shadow(0 0 10px var(--luz));animation:pop .6s}

/* secuencias, sombras, ordenar */
.col{display:flex;flex-direction:column;align-items:center;justify-content:space-around;gap:28px;width:100%;height:100%}
.line{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;background:var(--card);border-radius:30px;padding:16px 20px;box-shadow:0 8px 0 var(--soft);max-width:100%}
.line span{font-size:var(--e);width:calc(var(--e)*1.3);height:calc(var(--e)*1.3);display:grid;place-items:center;line-height:1;border-radius:18px}
.line span.q{background:var(--bg);font-weight:800;color:var(--ink);font-size:calc(var(--e)*.7)}
.opts{display:flex;gap:clamp(12px,2vw,28px);flex-wrap:wrap;justify-content:center}
.opt{font-size:var(--o);width:calc(var(--o)*1.5);height:calc(var(--o)*1.5);border-radius:28px;background:var(--card);box-shadow:0 8px 0 var(--soft);display:grid;place-items:center;line-height:1}
.opt:active{transform:translateY(4px);box-shadow:0 3px 0 var(--soft)}
.target{font-size:var(--e);line-height:1;background:var(--card);border-radius:36px;padding:14px 34px;box-shadow:0 8px 0 var(--soft)}
.dark{filter:brightness(0) opacity(.85)}

/* engranajes */
.gears{display:flex;flex-direction:column;align-items:center;justify-content:space-around;gap:20px;width:100%;height:100%}
.gears svg{max-width:100%;height:auto;background:var(--card);border-radius:30px;box-shadow:0 8px 0 var(--soft)}
.slot{cursor:pointer}
.spin{transform-box:view-box;animation:rot var(--d) linear infinite}
.spin.rev{animation-direction:reverse}
@keyframes rot{to{transform:rotate(360deg)}}
.tray{display:flex;gap:20px}
.tray button{width:120px;height:120px;border-radius:26px;background:var(--card);box-shadow:0 6px 0 var(--soft);border:6px solid transparent;display:grid;place-items:center}
.tray button.sel{border-color:var(--ink)}

/* instrumentos */
.inst{display:flex;flex-direction:column;align-items:center;justify-content:space-around;gap:24px;width:100%;height:100%}
.play{width:var(--p);height:var(--p);border-radius:50%;background:#D97706;color:#fff;font-size:calc(var(--p)*.42);box-shadow:0 8px 0 #A85A05;display:grid;place-items:center}
.play:active{transform:translateY(5px);box-shadow:0 3px 0 #A85A05}
.play.ring{animation:pop .5s}
.opt.ins{flex-direction:column;display:flex;align-items:center;justify-content:center;gap:4px;height:auto;padding:14px 0 10px}
.opt.ins small{font-size:max(15px,calc(var(--o)*.2));font-weight:800;letter-spacing:.04em}
.freeinst{display:grid;grid-template-columns:repeat(5,1fr);gap:clamp(12px,2vw,24px);width:min(100%,1100px)}
.freeinst .opt{width:100%;height:auto;aspect-ratio:1/1;max-width:100%}

/* escribir */
.typer{position:relative;width:100%;height:100%;min-height:55vh;background:var(--card);border-radius:30px;box-shadow:0 8px 0 var(--soft)}
.typer .scroll{position:absolute;top:0;right:0;bottom:0;left:0;overflow:auto;padding:24px 32px}
.typer textarea{position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;opacity:0;resize:none;border:0;font-size:16px;cursor:text;z-index:2}
.txt{font-weight:800;line-height:1.2;letter-spacing:.04em;color:var(--ink);word-break:break-all}
.txt span{display:inline-block;min-width:.3em}
.size0{font-size:clamp(32px,6vh,56px)}.size1{font-size:clamp(56px,11vh,110px)}.size2{font-size:clamp(90px,18vh,180px)}
.loco span:last-of-type{animation:pop .3s}
.caret{display:inline-block;width:.08em;height:.95em;background:var(--ink);vertical-align:-.1em;margin-left:.04em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hint{opacity:.25}
.txt .ghost{color:#C4BDE6}
.txt .ok{color:var(--ok)}
.txt .bad{color:var(--bad);text-decoration:underline}

.typewrap{display:flex;flex-direction:column;gap:14px;width:100%;height:100%}
.tbar{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.tbtn{min-width:72px;height:72px;border-radius:20px;background:var(--card);font-weight:800;box-shadow:0 5px 0 var(--soft);border:5px solid transparent;line-height:1;padding:0 10px}
.tbtn.wide{font-size:26px;padding:0 18px}
.tbtn[data-t="clear"]{font-size:34px}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--ink);color:#fff;border-radius:18px;padding:14px 22px;font-size:22px;font-weight:800;text-align:center;max-width:calc(100% - 32px)}
.tbtn.say{background:#D97706;color:#fff}
.tbtn.sel{border-color:var(--ink);background:#FFE9A0}
.typewrap .typer{flex:1;min-height:0}
/* plaza */
.plaza{display:flex;flex-direction:column;gap:14px;width:100%;height:100%}
.prow{display:flex;gap:14px;flex:1;min-height:0}
.scene{position:relative;flex:1;min-width:0;min-height:300px;border-radius:30px;overflow:hidden;background:linear-gradient(#BFE6FF 0 28%,#8BD46E 28% 100%);touch-action:none;box-shadow:0 8px 0 var(--soft)}
.scene .it{position:absolute;transform:translate(-50%,-50%);font-size:var(--it);line-height:1;transition:filter .5s;pointer-events:none;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.scene .it.dirty{filter:sepia(1) saturate(.6) brightness(.55)}
.scene .it.clean{filter:drop-shadow(0 0 10px #fff)}
.tr{position:absolute;transform:translate(-50%,-50%);line-height:1;cursor:grab;touch-action:none;z-index:2;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.tr.drag{position:fixed;z-index:40;cursor:grabbing;filter:drop-shadow(0 6px 4px rgba(0,0,0,.3));pointer-events:none}
.side{display:flex;flex-direction:column;gap:12px;justify-content:center}
.minibin{width:120px;height:86px;border-radius:14px 14px 26px 26px;background:var(--c);color:#fff;font-weight:800;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 5px 0 rgba(35,32,74,.25)}
.minibin.ama{color:var(--ink)}
.minibin .bi{font-size:34px;line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.addbar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.addbar button{width:76px;height:76px;border-radius:20px;background:var(--card);font-size:44px;box-shadow:0 5px 0 var(--soft);font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.addbar button:active{transform:translateY(4px)}
.line span.now{background:#FFE9A0;transform:scale(1.12)}
/* sombras libre */
.room{position:relative;width:100%;height:100%;min-height:340px;border-radius:30px;overflow:hidden;background:#F4F2FF;touch-action:none;cursor:crosshair}
.hid{position:absolute;transform:translate(-50%,-50%);font-size:var(--sz);line-height:1;text-align:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.hid small{display:block;font-family:var(--display);font-size:max(14px,calc(var(--sz)*.22));font-weight:800;color:var(--ink);margin-top:4px;min-height:1em}
.hid.lit{z-index:3;filter:drop-shadow(0 0 14px #FFE066)}
.darkness{position:absolute;top:0;right:0;bottom:0;left:0;z-index:2;pointer-events:none;background:radial-gradient(circle at var(--x,-300px) var(--y,-300px),transparent 0,transparent 70px,rgba(14,12,40,.97) 140px)}
.found{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:4;display:flex;gap:8px}
.found i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.25)}
.found i.on{background:#FFB800}
/* agregados */
.bugtag{font-weight:800;font-size:20px;background:#FFE9A0;border-radius:14px;padding:6px 14px;text-align:center}
.bugtag.big{font-size:clamp(24px,4vh,40px);padding:10px 22px}
.arrows .loop{background:#8E5BE8;box-shadow:0 6px 0 #6A3FC0}
.seq b{position:relative}
.seq b sup{position:absolute;right:-8px;top:-10px;background:var(--ink);color:#fff;border-radius:10px;font-size:max(14px,calc(var(--btn)*.22));padding:1px 6px;line-height:1.2;font-family:var(--display)}
.win .star.multi{font-size:min(14vh,110px);letter-spacing:.05em}
.win .note{font-size:clamp(20px,3.4vh,32px);font-weight:800;background:#fff;border-radius:18px;padding:10px 20px;text-align:center}
.cycle{display:flex;align-items:center;gap:10px;font-size:clamp(34px,7vh,64px);font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",var(--display)}
.cycle span{animation:pop .5s backwards}.cycle b{font-size:.6em;opacity:.5}
.line .tap{cursor:pointer;background:var(--bg)}
.line .fixed{background:#C8F2D8}
.target{text-align:center}
.target small.who{display:block;font-size:max(18px,calc(var(--e)*.2));font-weight:800;margin-top:6px;font-family:var(--display)}
.maze .swc{cursor:pointer}
.maze .need{animation:shake .4s,pulse .8s 2}
@keyframes pulse{50%{background:#FFB3B5}}
.fall{transform-box:fill-box;transform-origin:center;animation:fallaway .9s ease-in forwards}
@keyframes fallaway{to{transform:translate(var(--dx),520px) rotate(var(--rot,40deg));opacity:0}}
.robo{display:flex;gap:40px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%;height:100%}
.bot{position:relative;display:flex;flex-direction:column;align-items:center}
.ant{width:8px;height:34px;background:#5B6B8C;position:relative}
.ant::before{content:"";position:absolute;top:-14px;left:-10px;width:28px;height:28px;border-radius:50%;background:#E5484D}
.head{background:#AFC0E0;border:5px solid #5B6B8C;border-radius:30px;padding:16px 24px 26px;display:flex;gap:16px;justify-content:center;min-width:calc(var(--s)*2.6)}
.eyes{display:flex;gap:18px;padding:10px}.eyes i{width:24px;height:24px;border-radius:50%;background:#23204A}
.torso{position:relative;margin-top:8px;background:#C9D6EF;border:5px solid #5B6B8C;border-radius:26px;padding:18px 18px 30px;display:flex;flex-direction:column;gap:34px;align-items:center;min-width:calc(var(--s)*2.8);min-height:calc(var(--s)*2.4)}
.arm{position:absolute;left:100%;top:20px;margin-left:10px}
.base{margin-top:8px;background:#AFC0E0;border:5px solid #5B6B8C;border-radius:18px;padding:10px 26px 26px;min-width:calc(var(--s)*2.6);min-height:calc(var(--s)*.6);display:flex;justify-content:center}
.wheels{display:flex;gap:calc(var(--s)*1.1);margin-top:-8px}
.wheels i{width:calc(var(--s)*.9);height:calc(var(--s)*.9);border-radius:50%;background:#23204A;border:8px dashed #9A97AE}

const RECY=(()=>{const V=[[0,-44],[38.1,22],[-38.1,22]];let h="";
  for(let i=0;i<3;i++){const A=V[i],B=V[(i+1)%3],dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy),ux=dx/L,uy=dy/L,nx=-uy,ny=ux;
    const at=t=>[A[0]+dx*t,A[1]+dy*t],P=at(.13),Q=at(.62),T=at(.9);
    h+=`<line x1="${P[0].toFixed(1)}" y1="${P[1].toFixed(1)}" x2="${Q[0].toFixed(1)}" y2="${Q[1].toFixed(1)}" stroke="currentColor" stroke-width="15" stroke-linecap="round"/>`+
       `<polygon points="${T[0].toFixed(1)},${T[1].toFixed(1)} ${(Q[0]+nx*19).toFixed(1)},${(Q[1]+ny*19).toFixed(1)} ${(Q[0]-nx*19).toFixed(1)},${(Q[1]-ny*19).toFixed(1)}" fill="currentColor" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>`}
  return `<svg class="recy" viewBox="-54 -63 108 108" width="1em" height="1em" aria-hidden="true">${h}</svg>`})();

function beep(f=600,d=.12,type="sine"){ if(!sound)return; try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();

const RLV=[
  {r:3,c:5,s:[1,0],g:[1,3],k:[]},
  {r:4,c:4,s:[0,0],g:[2,2],k:[]},
  {r:4,c:5,s:[3,0],g:[0,4],k:[[2,0],[3,2],[1,3]]},
  {r:3,c:5,s:[1,0],g:[1,4],k:[],bug:[["R",3]]},
  {r:5,c:5,s:[0,0],g:[4,4],k:[[0,2],[1,2],[2,2],[4,1],[4,3]]},
  {r:5,c:5,s:[2,0],g:[2,4],k:[[1,2],[2,2],[3,2],[4,2],[2,1]]},
  {r:4,c:4,s:[0,0],g:[3,3],k:[[1,1],[2,1]],bug:[["R",3],["U",3]]},
  {r:5,c:6,s:[4,0],g:[0,5],k:[[3,0],[3,1],[3,2],[1,2],[1,3],[1,4],[0,1]]},
  {r:6,c:6,s:[0,0],g:[5,0],k:[[1,0],[2,0],[3,0],[4,0],[1,2],[2,2],[3,2],[4,2],[2,4],[3,4],[5,3]]},
  {r:6,c:6,s:[5,5],g:[0,0],k:[[4,5],[4,4],[4,3],[2,1],[2,2],[2,3],[2,4],[0,2],[1,2],[5,0]]},
  {r:5,c:5,s:[4,0],g:[0,4],k:[[3,0],[3,1],[1,3],[1,4]],bug:[["U",4],["R",4]]}
];
const DIR={U:[-1,0,"↑"],D:[1,0,"↓"],L:[0,-1,"←"],R:[0,1,"→"]};
function minBlocks(L,rocks,st,goal){
  const D=Object.values(DIR);const best=new Map();const dq=[[st[0],st[1],-1,0]];best.set(st+",-1",0);
  while(dq.length){const[r,c,d,cost]=dq.shift();if(cost>(best.get(r+","+c+","+d)??99))continue;
    if(r===goal[0]&&c===goal[1])return cost;
    D.forEach(([dr,dc],nd)=>{const nr=r+dr,nc=c+dc;if(nr<0||nc<0||nr>=L.r||nc>=L.c||rocks.has(nr+","+nc))return;
      const ncost=cost+(nd===d?0:1),k=nr+","+nc+","+nd;if(ncost<(best.get(k)??99)){best.set(k,ncost);nd===d?dq.unshift([nr,nc,nd,ncost]):dq.push([nr,nc,nd,ncost])}})}
  return 99;
}
function robot(){
  const free=lvl==="free";
  const L=free?{r:freeSize,c:freeSize,s:[0,0],g:[freeSize-1,freeSize-1],k:[]}:RLV[lvl];
  let st=[...L.s],goal=[...L.g],rocks=new Set(L.k.map(k=>k.join(","))),pos=[...st],running=false,tool="k";
  let seq=L.bug?L.bug.map(([d,n])=>({d,n})):[];
  const a=area();const btn=Math.max(64,Math.min(104,a.h/(free?6.2:5.4)));
  const side=btn*3+20+130+28;
  const cell=a.n?Math.floor(Math.min((a.w-24)/L.c-6,80)):Math.floor(Math.min((a.w-side-30)/L.c,(a.h-20)/L.r)-6);
  stage.innerHTML=`<div class="robot" style="--cell:${Math.max(36,cell)}px;--btn:${btn}px">
    <div class="grid ${free?'editing':''}" id="rg" style="grid-template-columns:repeat(${L.c},auto)"></div>
    <div class="ctrl">
      ${free?`<div class="tools" id="tools"><button data-t="r" aria-label="ROBOT">🤖</button><button data-t="g" aria-label="META">⭐</button><button data-t="k" aria-label="OBSTÁCULO">🧱</button></div>`:""}
      ${L.bug?`<div class="bugtag">🐞 ARREGLÁ EL PROGRAMA</div>`:""}
      <div class="arrows"><span></span><button data-d="U">↑</button><span></span>
        <button data-d="L">←</button><button class="loop" id="lp" aria-label="REPETIR">🔁</button><button data-d="R">→</button>
        <span></span><button data-d="D">↓</button><span></span></div>
      <div class="seq" id="seq"></div>
      <div class="go"><button class="big-btn" id="del" aria-label="BORRAR">↺</button><button class="big-btn run" id="run">▶ IR</button></div>
    </div></div>`;
  const same=(p,r,c)=>p[0]===r&&p[1]===c;
  function draw(){
    let h="";for(let r=0;r<L.r;r++)for(let c=0;c<L.c;c++){
      const t=same(pos,r,c)?"🤖":same(goal,r,c)?"⭐":rocks.has(r+","+c)?"🧱":"";
      h+=`<div class="cell" data-r="${r}" data-c="${c}">${t}</div>`}
    $("#rg").innerHTML=h;
  }
  function drawSeq(now=-1){$("#seq").innerHTML=seq.map((s,i)=>`<b class="${i===now?'now':''}" data-i="${i}">${DIR[s.d][2]}${s.n>1?`<sup>×${s.n}</sup>`:""}</b>`).join("")}
  const reset=()=>{pos=[...st];running=false;draw();drawSeq()};
  draw();drawSeq();
  if(free){
    const selT=()=>$("#tools").querySelectorAll("button").forEach(b=>b.classList.toggle("sel",b.dataset.t===tool));selT();
    $("#tools").onclick=e=>{const b=e.target.closest("button");if(!b)return;tool=b.dataset.t;beep(520,.06);selT()};
    $("#rg").onclick=e=>{
      const el=e.target.closest(".cell");if(!el||running)return;const r=+el.dataset.r,c=+el.dataset.c,k=r+","+c;
      if(tool==="r"){if(same(goal,r,c))return;rocks.delete(k);st=[r,c]}
      else if(tool==="g"){if(same(st,r,c))return;rocks.delete(k);goal=[r,c]}
      else{if(same(st,r,c)||same(goal,r,c))return;rocks.has(k)?rocks.delete(k):rocks.add(k)}
      beep(600,.05);pos=[...st];draw();
    };
  }
  stage.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{if(running||seq.length>=16)return;seq.push({d:b.dataset.d,n:1});beep(500+seq.length*25,.08);drawSeq()});
  $("#lp").onclick=()=>{if(running)return;const s=seq[seq.length-1];if(!s){shakeEl($("#seq"));return}if(s.n<9){s.n++;beep(600+s.n*40,.08)}drawSeq(seq.length-1);later(()=>drawSeq(),250)};
  $("#seq").onclick=e=>{const b=e.target.closest("b");if(!b||running)return;seq.splice(+b.dataset.i,1);drawSeq()};
  $("#del").onclick=()=>{if(running)return;seq=[];reset()};
  $("#run").onclick=()=>{
    if(running||!seq.length)return;running=true;pos=[...st];draw();
    const steps=[];seq.forEach((s,i)=>{for(let k=0;k<s.n;k++)steps.push([s.d,i])});
    let i=0;
    const fail=()=>{bad();$("#rg").classList.add("shake");later(()=>{$("#rg").classList.remove("shake");reset()},600)};
    const step=()=>{
      if(i>=steps.length){fail();return}
      drawSeq(steps[i][1]);const[dr,dc]=DIR[steps[i][0]];const n=[pos[0]+dr,pos[1]+dc];
      if(n[0]<0||n[1]<0||n[0]>=L.r||n[1]>=L.c||rocks.has(n.join(","))){fail();return}
      pos=n;draw();beep(700,.06);i++;
      if(same(pos,goal[0],goal[1])){
        if(free){later(()=>win(reset),300);return}
        const best=minBlocks(L,rocks,st,goal),perfect=seq.length<=best;
        later(()=>win(null,perfect?{title:"¡PERFECTO!",star:"⭐⭐⭐"}:{star:"⭐⭐",note:`🔁 SE PUEDE CON ${best} BLOQUE${best>1?"S":""}`}),300);return}
      later(step,420);
    };
    later(step,250);
  };
}

/* LABERINTO: dibujar el cable desde la pila hasta la lamparita */
const MZ=[2,3,3,4,4,5,5,6,7,8],MZSW=7;
const swSvg=on=>`<svg viewBox="0 0 100 100" width="84%" height="84%" aria-hidden="true"><rect x="8" y="58" width="84" height="20" rx="10" fill="#9A97AE"/><circle cx="22" cy="68" r="10" fill="#23204A"/><line x1="22" y1="68" x2="${on?82:66}" y2="${on?68:18}" stroke="#23204A" stroke-width="11" stroke-linecap="round"/><circle cx="${on?82:66}" cy="${on?68:18}" r="11" fill="${on?'#22A866':'#E5484D'}"/></svg>`;
function labe(){
  if(lvl==="free")return labeFree();
  const n=MZ[lvl],S=2*n+1;let seed=lvl*7919+101;const R=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const g=[...Array(S)].map(()=>Array(S).fill(1));
  const st=[[0,0]];const seen=new Set(["0,0"]);g[1][1]=0;
  while(st.length){const[r,c]=st[st.length-1];
    const nb=[[0,1],[1,0],[0,-1],[-1,0]].map(([a,b])=>[r+a,c+b]).filter(([a,b])=>a>=0&&b>=0&&a<n&&b<n&&!seen.has(a+","+b));
    if(!nb.length){st.pop();continue}
    const[a,b]=nb[Math.floor(R()*nb.length)];g[r+a+1][c+b+1]=0;g[2*a+1][2*b+1]=0;seen.add(a+","+b);st.push([a,b])}
  const goal=[S-2,S-2];let path=[[1,1]],done=false,sw=null,swOn=false;
  if(lvl>=MZSW){const prev=new Map([["1,1",null]]),q=[[1,1]];
    while(q.length){const[r,c]=q.shift();if(r===goal[0]&&c===goal[1])break;
      [[0,1],[1,0],[0,-1],[-1,0]].forEach(([a,b])=>{const k=(r+a)+","+(c+b);if(!g[r+a][c+b]&&!prev.has(k)){prev.set(k,r+","+c);q.push([r+a,c+b])}})}
    const sol=[];let k=goal.join(",");while(k){sol.unshift(k);k=prev.get(k)}
    sw=sol[Math.floor(sol.length/2)].split(",").map(Number)}
  const a=area();const cell=Math.max(18,Math.floor(Math.min((a.h-20)/S,(a.w-10)/S,120)));
  stage.innerHTML=`<div class="maze" id="mz" style="--cell:${cell}px;width:${S*cell}px;height:${S*cell}px"></div>`;
  const mz=$("#mz");let h="";
  const isSw=(r,c)=>sw&&sw[0]===r&&sw[1]===c;
  for(let r=0;r<S;r++)for(let c=0;c<S;c++){const s=r===1&&c===1,e=r===goal[0]&&c===goal[1];
    h+=`<div class="${g[r][c]?'w':''}${e?' goal':''}${isSw(r,c)?' swc':''}" data-r="${r}" data-c="${c}" style="left:${c*cell}px;top:${r*cell}px">${s?"🔋":e?"💡":isSw(r,c)?swSvg(false):""}</div>`}
  mz.innerHTML=h;
  const at=(r,c)=>mz.children[r*S+c];
  const paint=()=>{mz.querySelectorAll(".p").forEach(d=>d.classList.remove("p"));path.forEach(([r,c])=>at(r,c).classList.add("p"))};
  paint();
  const atGoal=()=>{const[r,c]=path[path.length-1];return r===goal[0]&&c===goal[1]};
  const check=()=>{if(!atGoal()||done)return;
    if(sw&&!swOn){const el=at(...sw);el.classList.remove("need");void el.offsetWidth;el.classList.add("need");beep(250,.15);return}
    done=true;mz.classList.add("lit");later(win,900)};
  const step=el=>{
    if(!el||done||el.dataset.r===undefined)return;const r=+el.dataset.r,c=+el.dataset.c;
    const[lr,lc]=path[path.length-1];
    if(path.length>1){const[pr,pc]=path[path.length-2];if(pr===r&&pc===c){path.pop();paint();return}}
    if(Math.abs(lr-r)+Math.abs(lc-c)!==1||g[r][c]||path.some(([x,y])=>x===r&&y===c))return;
    path.push([r,c]);paint();beep(500+path.length*12,.04);check();
  };
  let down=false;
  mz.addEventListener("pointerdown",e=>{const el=e.target.closest("#mz > div");try{mz.releasePointerCapture(e.pointerId)}catch(_){}
    if(el&&sw&&!done&&isSw(+el.dataset.r,+el.dataset.c)&&path.some(([x,y])=>isSw(x,y))){swOn=!swOn;el.innerHTML=swSvg(swOn);el.classList.remove("need");beep(swOn?800:400,.08);check();return}
    down=true;step(el)});
  mz.addEventListener("pointermove",e=>{if(!down)return;const el=document.elementFromPoint(e.clientX,e.clientY);step(el&&el.closest("#mz > div"))});
  window.onpointerup=()=>down=false;
}

/* ENGRANAJES: poner ruedas del tamaño justo para que gire la hélice */
const GR=[["s"],["b"],["s","b"],["b","s"],["s","s","b"],["b","s","b"],["s","b","s","b"],["b","s","s","b","s"]];

function gearPath(x,y,r){const t=Math.max(8,Math.round(r/6.5)),ri=r-12,st=Math.PI*2/t;let d="";
  for(let i=0;i<t;i++){const a=i*st;[[ri,a],[r,a+st*.18],[r,a+st*.48],[ri,a+st*.66]].forEach(([rr,aa],k)=>{d+=(i===0&&k===0?"M":"L")+(x+rr*Math.cos(aa)).toFixed(1)+" "+(y+rr*Math.sin(aa)).toFixed(1)})}
  return d+"Z"}
function engr(){
  if(lvl==="free")return engrFree();
  const L=GR[lvl];let fill=L.map(()=>false),pick="s",done=false;
  const y=190,list=[{r:66,k:"m"},...L.map(s=>({r:GRAD[s],k:"slot",s})),{r:66,k:"f"}];
  let x=40;list.forEach((g,i)=>{x+=i===0?g.r:list[i-1].r+g.r-8;g.x=x});const W=x+66+40;

  const svg=$("#gs");

    const all=fill.every(Boolean);let h="",dir=false;

      const sp=all?`class="spin ${dir?'rev':''}" style="transform-origin:${g.x}px ${y}px;--d:${(g.r/28).toFixed(2)}s"`:"";dir=!dir;
      if(g.k==="slot"&&!fill[i-1]){h+=`<g class="slot" data-i="${i-1}"><circle cx="${g.x}" cy="${y}" r="${g.r-4}" fill="#EDE8FF" stroke="#B9B2D8" stroke-width="6" stroke-dasharray="14 10"/><circle cx="${g.x}" cy="${y}" r="8" fill="#B9B2D8"/></g>`;return}
      const col=g.k==="m"?"#FF6B4A":g.k==="f"?"#FFB800":(i%2?"#2F80ED":"#22A866");
      h+=`<g ${sp}><path d="${gearPath(g.x,y,g.r)}" fill="${col}"/><circle cx="${g.x}" cy="${y}" r="13" fill="#fff"/>
        ${g.k==="m"?`<rect x="${g.x-6}" y="${y-g.r+16}" width="12" height="${g.r-16}" rx="6" fill="#23204A"/><circle cx="${g.x}" cy="${y-g.r+18}" r="14" fill="#23204A"/>`:""}
        ${g.k==="f"?[0,120,240].map(d=>`<ellipse cx="${g.x}" cy="${y-48}" rx="18" ry="48" fill="#F0569A" transform="rotate(${d} ${g.x} ${y})"/>`).join("")+`<circle cx="${g.x}" cy="${y}" r="16" fill="#23204A"/>`:""}</g>`;
    });
    svg.innerHTML=h;
  }
  const selT=()=>$("#tray").querySelectorAll("button").forEach(b=>b.classList.toggle("sel",b.dataset.s===pick));
  selT();draw();
  $("#tray").onclick=e=>{const b=e.target.closest("button");if(!b)return;pick=b.dataset.s;beep(520,.06);selT()};

    if(L[i]!==pick){shakeEl(svg);return}
    fill[i]=true;good();draw();
    if(fill.every(Boolean)){done=true;[392,440,523].forEach((f,k)=>later(()=>beep(f,.15,"triangle"),k*150));later(win,2400)}

function AC(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();return ac}
function tone(type,f,t0,dur,o={}){
  const{a=.01,vol=.25,vib=0,vibDelay=0,lp=0,lpEnv=null,bp=0,hold=false,slide=0}=o;const c=AC();const os=c.createOscillator(),g=c.createGain();os.type=type;
  if(slide){os.frequency.setValueAtTime(f*slide,t0);os.frequency.exponentialRampToValueAtTime(f,t0+.08)}else os.frequency.setValueAtTime(f,t0);
  let node=os;
  if(vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=5.8;lg.gain.setValueAtTime(vibDelay?0:f*vib,t0);
    if(vibDelay)lg.gain.linearRampToValueAtTime(f*vib,t0+vibDelay);l.connect(lg).connect(os.frequency);l.start(t0);l.stop(t0+dur+.1)}
  if(lp||lpEnv||bp){const fl=c.createBiquadFilter();fl.type=bp?"bandpass":"lowpass";
    if(bp){fl.frequency.value=bp;fl.Q.value=1.2}
    else if(lpEnv){fl.frequency.setValueAtTime(lpEnv[0],t0);fl.frequency.linearRampToValueAtTime(lpEnv[1],t0+.05);fl.frequency.linearRampToValueAtTime(lpEnv[2],t0+dur)}
    else fl.frequency.value=lp;
    os.connect(fl);node=fl}
  g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(vol,t0+a);
  if(hold)g.gain.setValueAtTime(vol,t0+dur-.08);
  g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
  node.connect(g).connect(c.destination);os.start(t0);os.stop(t0+dur+.05);
}
function pluck(f,t0,dur=1.4){const c=AC(),sr=c.sampleRate,N=Math.round(sr/f),len=Math.floor(sr*dur);const b=c.createBuffer(1,len,sr),d=b.getChannelData(0);
  const buf=new Float32Array(N).map(()=>Math.random()*2-1);for(let i=0;i<len;i++){const j=i%N,v=buf[j];d[i]=v*.45;buf[j]=.497*(v+buf[(j+1)%N])}
  const s=c.createBufferSource();s.buffer=b;s.connect(c.destination);s.start(t0)}
function noise(t0,dur,vol,hp,pow=3){const c=AC(),len=Math.floor(c.sampleRate*dur);const b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,pow);const s=c.createBufferSource();s.buffer=b;const f=c.createBiquadFilter();f.type="highpass";f.frequency.value=hp;
  const g=c.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(c.destination);s.start(t0)}
function drum(t0,f1,f2,len,vol=1){const c=AC();const o=c.createOscillator(),g=c.createGain();o.frequency.setValueAtTime(f1,t0);o.frequency.exponentialRampToValueAtTime(f2,t0+len*.7);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+len);o.connect(g).connect(c.destination);o.start(t0);o.stop(t0+len+.05)}

const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const LOCOCOL=["#E5484D","#FF8A1F","#E0A800","#22A866","#2F80ED","#8E5BE8","#F0569A","#14A89A"];
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3500)}
function speak(txt){
  if(!("speechSynthesis" in window)||typeof SpeechSynthesisUtterance==="undefined"){toast("🔇 ESTE NAVEGADOR NO PUEDE LEER EN VOZ ALTA");return}
  try{const sy=window.speechSynthesis;sy.cancel();const t=txt.trim().toLowerCase();if(!t){toast("⌨️ PRIMERO ESCRIBÍ ALGO");return}
    const vs=sy.getVoices();const v=vs.find(v=>/es[-_]AR/i.test(v.lang))||vs.find(v=>/es[-_](US|MX|419)/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang));
    const parts=loco?t.split(/\s+/).filter(Boolean):[t];
    let started=false,warned=false;
    parts.forEach((w,i)=>{const u=new SpeechSynthesisUtterance(w);u.lang="es-AR";if(v)u.voice=v;
      if(loco){u.pitch=i%2?(.1+Math.random()*.6):(1.3+Math.random()*.7);u.rate=.7+Math.random()*.8}else{u.rate=.85;u.pitch=1.1}
      u.onstart=()=>{started=true};u.onerror=e=>{if(!warned&&e.error!=="interrupted"&&e.error!=="canceled"){warned=true;toast("🔇 NO SE PUDO LEER EN VOZ ALTA")}};
      sy.speak(u)});
    setTimeout(()=>{if(!started&&!sy.speaking&&!warned)toast("🔇 ESTE NAVEGADOR NO PUEDE LEER EN VOZ ALTA")},2500)}catch(e){toast("🔇 ESTE NAVEGADOR NO PUEDE LEER EN VOZ ALTA")}
}

const norm=c=>c.toUpperCase().normalize("NFD").replace(/[̀-ͯ]/g,"");

  const free=lvl==="free",T=free?[]:[...ESC[lvl]];let val=free?typeVal:"",done=false;
  stage.innerHTML=`<div class="typewrap"><div class="tbar" id="tb">${[0,1,2].map(z=>`<button class="tbtn" data-z="${z}" aria-label="TAMAÑO" style="font-size:${[22,34,50][z]}px">A</button>`).join("")}${free?`<button class="tbtn wide" data-t="loco" aria-label="MODO LOCO">🤪 LOCO</button>`:""}<button class="tbtn" data-t="clear" aria-label="BORRAR TODO">🗑️</button><button class="tbtn wide say" data-t="say" aria-label="LEER">🔊 LEER</button></div><div class="typer"><div class="scroll" id="sc"><div class="txt" id="tx"></div></div>

  const ti=$("#ti");ti.value=val;
  const ch=c=>c===" "?"&nbsp;":esc(c);
  const render=()=>{
    const arr=[...ti.value.toUpperCase()];
    if(free){
      while(typeAttrs.length<arr.length)typeAttrs.push({c:LOCOCOL[Math.floor(Math.random()*LOCOCOL.length)],s:(.6+Math.random()*1.1).toFixed(2),r:Math.round(Math.random()*24-12)});
      typeAttrs.length=arr.length;
      $("#tx").innerHTML=(arr.length?"":`<span class="hint">⌨️</span>`)+arr.map((c,i)=>c==="\n"?"<br>":`<span${loco?` style="color:${typeAttrs[i].c};font-size:${typeAttrs[i].s}em;transform:rotate(${typeAttrs[i].r}deg)"`:""}>${ch(c)}</span>`).join("")+`<i class="caret"></i>`;
    }else{
      let h="";
      T.forEach((t,i)=>{
        if(i===arr.length)h+=`<i class="caret"></i>`;
        if(i<arr.length){const ok=norm(arr[i])===norm(t);h+=`<span class="${ok?'ok':'bad'}">${!ok&&arr[i]===" "?"_":ch(arr[i])}</span>`}
        else h+=`<span class="ghost">${ch(t)}</span>`;
      });

    else if(b.dataset.t==="clear"){val="";if(free){typeVal="";typeAttrs=[]}ti.value="";beep(300,.2)}
    else if(b.dataset.t==="say"){speak(free?typeVal:ESC[lvl]);try{ti.focus()}catch(_){}return}
    beep(560,.05);marks();render();try{ti.focus()}catch(_){}};

}

/* ===== CLASIFICAR (motor común) ===== */
function classify(B,keys,n,onWin){
  let q=[];const pools={};keys.forEach(k=>pools[k]=shuffle([...B[k].it]));
  for(let i=0;i<n;i++){const k=keys[i%keys.length];if(!pools[k].length)pools[k]=shuffle([...B[k].it]);q.push({k,e:pools[k].pop()})}
  q=shuffle(q);let done=0;
  stage.innerHTML=`<div class="reci"><div class="prog" id="pr"></div><div class="item" id="it"></div>
   <div class="bins">${keys.map(k=>`<button class="bin ${B[k].ama?'ama':''}" style="--c:${B[k].c}" data-k="${k}"><span class="bi">${B[k].i}</span>${B[k].n}</button>`).join("")}</div></div>`;
  const show=()=>{$("#pr").innerHTML=q.map((_,i)=>`<i class="${i<done?'on':''}"></i>`).join("");$("#it").textContent=q[done].e;$("#it").classList.remove("pop");void $("#it").offsetWidth;$("#it").classList.add("pop")};
  show();
  stage.querySelectorAll(".bin").forEach(b=>b.onclick=()=>{
    if(done>=q.length)return;
    if(b.dataset.k===q[done].k){good();b.classList.remove("pop");void b.offsetWidth;b.classList.add("pop");done++;
      if(done>=q.length){$("#pr").innerHTML=q.map(()=>`<i class="on"></i>`).join("");later(onWin||win,300)}else show()}
    else shakeEl($("#it"))});
}

  <div class="rhead"><div class="screen"><i></i><i></i></div><div class="att spk">🔊</div><div class="att mic">🎤</div></div>
  <div class="rbody"><div class="att bat">🔋</div><div class="att arm">🦾</div><div class="att mag">🧲</div><div class="att term">🌡️</div></div>
  <div class="legs"></div><div class="att whl">${WHEEL}</div><div class="att leg2">🦿🦿</div>`;
function robo(){
  if(lvl==="free")return roboFree();

      <div class="goal ${L.hide?'hidden':''} ${L.small?'small':''}" id="gl" style="left:${G.x}%;bottom:${G.b}%">${L.goal}</div>${L.hide?`<div class="bush" id="bs">🌳</div>`:""}

  const rb=$("#rb"),sc2=$("#sc2"),bb=$("#bb"),gl=$("#gl");let k=0,busy=false,rbB="22%";const got=new Set();const needs=L.steps.map(s=>s[0]);
  const say=(t,v)=>{bb.textContent=t;bb.classList.remove("pop");void bb.offsetWidth;bb.classList.add("pop");if(v)sayQuiet(v)};
  const ask=()=>{const[need,txt,v]=L.steps[k];say(txt,v);
    const others=shuffle(Object.keys(RP).filter(x=>!needs.includes(x)&&!got.has(x))).slice(0,lvl>=5?3:2);
    $("#tr").innerHTML=shuffle([need,...others]).map(x=>`<button class="opt ins" data-k="${x}">${RP[x].e}<small>${RP[x].n}</small></button>`).join("");busy=false};
  const fly=(e,cls)=>{const s=document.createElement("span");s.className=cls;s.textContent=e;sc2.appendChild(s);later(()=>s.remove(),2000)};
  const walk=()=>{rb.style.left=`calc(${G.x}% - ${u*3.4}px)`;$("#bm").classList.remove("scan")};
  const act=need=>{
    if(need==="bateria"){rb.classList.add("on");[392,523,659].forEach((f,i)=>later(()=>beep(f,.12,"triangle"),i*120));return 900}
    if(need==="luz"){sc2.classList.remove("night");sc2.classList.add("lit");beep(880,.2);return 900}
    if(need==="camara"){$("#bm").classList.add("scan");later(()=>{gl.classList.remove("hidden");gl.classList.add("pop");const bs=$("#bs");if(bs)bs.classList.add("aside");good()},900);return 1700}

    if(need==="termometro"){say("❄️ ¡HACE MUCHO FRÍO!");[0,1,2,3,4,5].forEach(i=>later(()=>fly("❄️","snow"),i*220));beep(1200,.2);return 2000}
    if(need==="parlante"){say(L.end||"🎉 ¡HOLA!",(L.end||"hola").replace(/[^\p{L} ¡!]/gu,"").toLowerCase());return 1700}
    if(need==="microfono"){[0,1,2,3].forEach(i=>later(()=>{fly(i%2?"🎶":"🎵","note");beep(523+i*90,.15,"triangle")},i*300));return 1700}
    if(need==="antena"){fly("✉️","mail");later(()=>{say("📩 ¡RECIBÍ EL MENSAJE!");beep(880,.15)},1200);return 2200}
    return 600};
  $("#tr").onclick=e=>{const b=e.target.closest("button");if(!b||busy)return;const need=L.steps[k][0];
    if(b.dataset.k!==need){shakeEl(b);rb.classList.remove("no");void rb.offsetWidth;rb.classList.add("no");return}
    busy=true;got.add(need);rb.classList.add("has-"+RP[need].c);good();$("#tr").innerHTML="";const d=act(need);
    later(()=>{k++;if(k<L.steps.length)ask();else{if(!L.end)say("⭐ ¡LISTO!");rb.classList.add("happy");later(win,1300)}},d)};
  ask();
}

/* ROBOT LIBRE: un campo para pasear con las piezas que elijan */
function roboFree(){
  const a=area();const H=a.n?400:Math.max(320,a.h-230);const u=Math.max(24,Math.min(46,H/8.5));
  const objs=[{e:"⚽",n:"LA PELOTA",x:32,y:18},{e:"🔑",n:"LAS LLAVES",x:70,y:44,hid:1},{e:"🧸",n:"EL OSITO",x:14,y:46,hid:1},{e:"📻",n:"LA RADIO",x:86,y:8,radio:1},

  const bushes=[[70,42],[14,44]];

      <div class="bubble" id="bb"></div>
      <div class="decor" style="left:48%;bottom:52%;font-size:${u*3.2}px">🌳</div><div class="decor" style="left:88%;bottom:56%;font-size:${u*2.6}px">🏠</div>
      ${objs.map((o,i)=>`<div class="fobj ${o.hid?'hidden':''}" id="fo${i}" style="left:${o.x}%;bottom:${o.y}%;font-size:${u*(o.metal?.7:1)}px">${o.e}</div>`).join("")}
      ${bushes.map(([x,y])=>`<div class="decor bushf" style="left:${x}%;bottom:${y-2}%;font-size:${u*1.9}px">🌳</div>`).join("")}
      <div class="rbot fr" id="rb" style="--u:${Math.round(u*.62)}px">${botHTML()}</div></div>
    <div class="tray2 wide parts" id="tr">${Object.keys(RP).map(k=>`<button class="opt ins" data-k="${k}">${RP[k].e}<small>${RP[k].n}</small></button>`).join("")}</div>
    <div class="tbar" id="acts"></div></div>`;
  const rb=$("#rb"),sc2=$("#sc2"),bb=$("#bb");
  const has=k=>parts.has(k);
  const say=(t,v)=>{bb.textContent=t;bb.classList.remove("pop");void bb.offsetWidth;bb.classList.add("pop");if(v)sayQuiet(v)};
  const fly=(e,cls,x,y)=>{const s=document.createElement("span");s.className=cls;s.textContent=e;if(x!==undefined){s.style.left=x+"%";s.style.bottom=y+"%"}sc2.appendChild(s);later(()=>s.remove(),2000)};
  const dist=o=>Math.hypot(o.x-pos.x,(o.y-pos.y)*.8);
  const place=()=>{rb.style.left=pos.x+"%";rb.style.bottom=pos.y+"%";rb.classList.toggle("flying",flying);
    sc2.style.setProperty("--lx",pos.x+"%");sc2.style.setProperty("--ly",(100-pos.y-10)+"%");
    if(held!==null){const el=$("#fo"+held);el.style.left=`calc(${pos.x}% + ${u*1.2}px)`;el.style.bottom=`calc(${pos.y}% + ${u*1.6}px)`}};
  const scene=()=>{sc2.classList.toggle("night",night&&!(lamp&&has("luz")&&has("bateria")));sc2.classList.toggle("dark2",night);sc2.classList.toggle("lamp-on",night&&lamp&&has("luz")&&has("bateria"))};
  const ACTS=[["move",null],["camara","👀 MIRAR"],["brazo","✋ AGARRAR"],["iman","🧲 ATRAER"],["helice","🌀 VOLAR"],["luz","💡 LUZ"],["parlante","💬 HABLAR"],["microfono","👂 ESCUCHAR"],["antena","📡 MENSAJE"],["termometro","🌡️ MEDIR"]];
  const drawActs=()=>{
    let h=`<button class="tbtn wide" data-a="night">${night?"☀️ DÍA":"🌙 NOCHE"}</button>`;
    if(has("ruedas")||has("piernas"))h+=`<button class="tbtn mv" data-m="L">←</button><button class="tbtn mv" data-m="U">↑</button><button class="tbtn mv" data-m="D">↓</button><button class="tbtn mv" data-m="R">→</button>`;
    ACTS.slice(1).forEach(([k,t])=>{if(has(k))h+=`<button class="tbtn wide" data-a="${k}">${k==="brazo"&&held!==null?"✋ SOLTAR":k==="helice"&&flying?"🌀 BAJAR":t}</button>`});

    $("#tr").querySelectorAll("button").forEach(b=>b.classList.toggle("sel",has(b.dataset.k)));

      let best=-1,bd=99;objs.forEach((o,i)=>{if(o.hid||o.gone||o.radio)return;if(o.high&&!flying)return;const d=dist(o);if(d<bd){bd=d;best=i}});

    if(a==="iman"){let n=0;objs.forEach((o,i)=>{if(o.metal&&!o.gone&&dist(o)<30){o.gone=1;n++;const el=$("#fo"+i);el.style.left=pos.x+"%";el.style.bottom=(pos.y+6)+"%";later(()=>{el.style.opacity="0"},700)}});

    if(a==="helice"){flying=!flying;if(!flying)pos.y=Math.min(pos.y,52);[0,1,2,3].forEach(i=>later(()=>beep(flying?500+i*60:700-i*60,.06,"sawtooth"),i*120));drawActs();return}
    if(a==="luz"){lamp=!lamp;beep(lamp?880:440,.12);scene();if(!night)say(lamp?"💡 ¡LUZ PRENDIDA!":"💡 LUZ APAGADA");return}
    if(a==="parlante"){const t=held!==null?"¡TENGO "+objs[held].n+"!":["¡HOLA, CHICOS!","¡SOY UN ROBOT!","¡QUÉ LINDO DÍA!","¡VAMOS A JUGAR!"][Math.floor(Math.random()*4)];say("💬 "+t,t.toLowerCase());return}
    if(a==="microfono"){const r=objs.find(o=>o.radio);if(dist(r)<26){[0,1,2,3].forEach(i=>later(()=>{fly(i%2?"🎶":"🎵","note2",r.x,r.y+8);beep(523+i*90,.15,"triangle")},i*250));rb.classList.add("dance");later(()=>rb.classList.remove("dance"),2600);say("💃 ¡ESCUCHO MÚSICA!")}
      else say("🤫 NO ESCUCHO NADA","no escucho nada");return}
    if(a==="antena"){fly("✉️","mail");const m=["📩 ¡BUSCÁ EL OSITO!","📩 ¡HAY UNA MANZANA EN EL ÁRBOL!","📩 ¡LA RADIO ESTÁ PRENDIDA!","📩 ¡SE CAYERON TORNILLOS!"][Math.floor(Math.random()*4)];later(()=>{say(m);beep(880,.15)},1100);return}

  };

  const svg=$("#tw");svg.innerHTML=`<g id="tm"></g><g id="tfx"></g>`;const tm=$("#tm"),tfx=$("#tfx");

    tm.innerHTML=h;
  }

    if(!busy&&!done){const w=BW[size]/2;hx+=dir*speed*dt;if(hx>990-w){hx=990-w;dir=-1}if(hx<10+w){hx=10+w;dir=1}}
    if(fall){fall.vy+=2600*dt;fall.y+=fall.vy*dt;if(fall.y>=fall.to){fall.y=fall.to;land()}}

      if(cx<stack[k].x-stack[k].w/2||cx>stack[k].x+stack[k].w/2)f=k}
    if(f>=0){const falling=stack.splice(f+1),d=falling.reduce((s,b)=>s+b.x,0)/falling.length>stack[f].x?1:-1;bad();

    prog();
    if(stack.length>=N){done=true;later(win,700);return}
    busy=false;
  }
  svg.addEventListener("pointerdown",e=>{e.preventDefault();drop()});
  $("#sz").onclick=e=>{const b=e.target.closest("button");if(!b)return;size=b.dataset.s;beep(520,.05);prog()};
  prog();requestAnimationFrame(frame);
}

/* LABERINTO LIBRE: armar paredes y probar el cable */
function labeFree(){
  const S=8;let walls=new Set(),st=[0,0],goal=[S-1,S-1],tool="w",path=[[0,0]],done=false;
  const a=area();const btn=a.n?64:Math.max(64,Math.min(90,a.h/7));
  const cell=Math.max(30,Math.floor(Math.min((a.h-btn-40)/S,(a.w-10)/S,100)));
  stage.innerHTML=`<div class="col" style="--btn:${btn}px;justify-content:center;gap:16px"><div class="tools" id="tl">
    <button data-t="w" aria-label="PARED">🧱</button><button data-t="s" aria-label="PILA">🔋</button><button data-t="g" aria-label="LAMPARITA">💡</button><button data-t="c" aria-label="CABLE">✏️</button></div>
    <div class="maze" id="mz" style="--cell:${cell}px;width:${S*cell}px;height:${S*cell}px"></div></div>`;
  const mz=$("#mz");
  const same=(p,r,c)=>p[0]===r&&p[1]===c;
  const render=()=>{let h="";for(let r=0;r<S;r++)for(let c=0;c<S;c++){
      const w=walls.has(r+","+c),p=path.some(q=>same(q,r,c));
      h+=`<div class="${w?'w':''}${p?' p':''}${same(goal,r,c)?' goal':''}" data-r="${r}" data-c="${c}" style="left:${c*cell}px;top:${r*cell}px">${same(st,r,c)?"🔋":same(goal,r,c)?"💡":""}</div>`}
    mz.innerHTML=h;mz.classList.toggle("lit",done)};
  const selT=()=>$("#tl").querySelectorAll("button").forEach(b=>b.classList.toggle("sel",b.dataset.t===tool));
  const reset=()=>{path=[[...st]];done=false;render()};
  selT();render();
  $("#tl").onclick=e=>{const b=e.target.closest("button");if(!b)return;tool=b.dataset.t;beep(520,.06);selT()};
  const step=el=>{
    if(!el||done||el.dataset.r===undefined)return;const r=+el.dataset.r,c=+el.dataset.c,[lr,lc]=path[path.length-1];
    if(path.length>1){const[pr,pc]=path[path.length-2];if(pr===r&&pc===c){path.pop();render();return}}
    if(Math.abs(lr-r)+Math.abs(lc-c)!==1||walls.has(r+","+c)||path.some(q=>same(q,r,c)))return;
    path.push([r,c]);beep(500+path.length*12,.04);
    if(same(goal,r,c)){done=true;render();fanfare();later(()=>win(reset),900)}else render();
  };
  let down=false;
  mz.addEventListener("pointerdown",e=>{const el=e.target.closest("#mz > div");if(!el)return;try{mz.releasePointerCapture(e.pointerId)}catch(_){}
    if(tool==="c"){down=true;step(el);return}
    const r=+el.dataset.r,c=+el.dataset.c,k=r+","+c;
    if(tool==="w"){if(same(st,r,c)||same(goal,r,c))return;walls.has(k)?walls.delete(k):walls.add(k)}
    else if(tool==="s"){if(same(goal,r,c))return;walls.delete(k);st=[r,c]}
    else{if(same(st,r,c))return;walls.delete(k);goal=[r,c]}
    beep(600,.05);reset()});
  mz.addEventListener("pointermove",e=>{if(!down)return;const el=document.elementFromPoint(e.clientX,e.clientY);step(el&&el.closest("#mz > div"))});
  window.onpointerup=()=>down=false;
}

/* ENGRANAJES LIBRE: armar una cadena de ruedas que siempre gira */
function engrFree(){
  let chain=[],power="m",theta=0,energy=0,dragA=null,last=performance.now(),gs=[],L=[];
  const a=area();
  stage.innerHTML=`<div class="gears"><div class="tbar" id="pw"><button class="tbtn wide" data-p="m">⚡ MOTOR</button><button class="tbtn wide" data-p="c">🔄 MANIVELA</button><button class="tbtn wide" data-p="r">🌀 RESORTE</button></div>

  const svg=$("#gs");
  function draw(){
    L=[{r:66,k:"m"},...chain.map(s=>({r:GRAD[s],k:s}))];
    L.forEach((g,i)=>{if(!i){g.x=0;g.y=0;return}const p=L[i-1],d=p.r+g.r-8,an=i%2?.55:-.55;g.x=p.x+d*Math.cos(an);g.y=p.y+d*Math.sin(an)});
    const minX=Math.min(...L.map(g=>g.x-g.r))-30,maxX=Math.max(...L.map(g=>g.x+g.r))+30,minY=Math.min(...L.map(g=>g.y-g.r))-40,maxY=Math.max(...L.map(g=>g.y+g.r))+40;
    const W=Math.max(500,maxX-minX),H=Math.max(300,maxY-minY);
    const ox=minX-(W-(maxX-minX))/2,oy=minY-(H-(maxY-minY))/2;
    L.forEach(g=>{g.x-=ox;g.y-=oy});svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
    const sc=Math.min((a.w-10)/W,(a.h-250)/H,1.6);svg.setAttribute("width",Math.floor(W*sc));svg.setAttribute("height",Math.floor(H*sc));
    let h="";
    L.forEach((g,i)=>{const lastG=i===L.length-1;
      const col=g.k==="m"?"#FF6B4A":lastG?"#FFB800":(i%2?"#2F80ED":"#22A866");
      let extra="";
      if(g.k==="m"){
        if(power==="c")extra=`<rect x="${g.x-7}" y="${g.y-g.r-34}" width="14" height="${g.r+34}" rx="7" fill="#23204A"/><circle cx="${g.x}" cy="${g.y-g.r-34}" r="20" fill="#23204A"/>`;
        else if(power==="r")extra=`<path d="M${g.x} ${g.y} m-6 0 a6 6 0 1 1 12 0 a12 12 0 1 1 -24 0 a18 18 0 1 1 36 0 a24 24 0 1 1 -48 0" fill="none" stroke="#23204A" stroke-width="6"/>`;
        else extra=`<text x="${g.x}" y="${g.y+14}" text-anchor="middle" font-size="44" font-family="sans-serif">⚡</text>`;
      }
      h+=`<g class="gr"><path d="${gearPath(g.x,g.y,g.r)}" fill="${col}"/>${g.k==="m"?"":`<circle cx="${g.x}" cy="${g.y}" r="13" fill="#fff"/>`}${extra}
        ${lastG&&i>0?[0,120,240].map(d=>`<ellipse cx="${g.x}" cy="${g.y-g.r*.6}" rx="${g.r*.22}" ry="${g.r*.6}" fill="#F0569A" transform="rotate(${d} ${g.x} ${g.y})"/>`).join("")+`<circle cx="${g.x}" cy="${g.y}" r="16" fill="#23204A"/>`:""}</g>`});
    svg.innerHTML=h;gs=[...svg.querySelectorAll("g.gr")];
    $("#pw").querySelectorAll("button").forEach(b=>b.classList.toggle("sel",b.dataset.p===power));
    $("#wind").hidden=power!=="r";
    apply();
  }
  const apply=()=>gs.forEach((g,i)=>g.setAttribute("transform",`rotate(${(theta*(L[0].r/L[i].r)*(i%2?-1:1)).toFixed(2)} ${L[i].x.toFixed(1)} ${L[i].y.toFixed(1)})`));
  const frame=t=>{if(!document.body.contains(svg))return;const dt=Math.min(.05,(t-last)/1000);last=t;
    if(power==="m")theta+=110*dt;else if(power==="r"){theta+=energy*80*dt;energy=Math.max(0,energy-dt*.45)}
    apply();requestAnimationFrame(frame)};
  requestAnimationFrame(frame);
  draw();
  const ang=e=>{const b=gs[0].getBoundingClientRect();return Math.atan2(e.clientY-(b.top+b.height/2),e.clientX-(b.left+b.width/2))*180/Math.PI};
  svg.addEventListener("pointerdown",e=>{if(power!=="c")return;dragA=ang(e);try{svg.setPointerCapture(e.pointerId)}catch(_){}});
  svg.addEventListener("pointermove",e=>{if(dragA===null)return;const a2=ang(e);let d=a2-dragA;if(d>180)d-=360;if(d<-180)d+=360;theta+=d;dragA=a2});
  svg.addEventListener("pointerup",()=>{dragA=null});
  $("#pw").onclick=e=>{const b=e.target.closest("button");if(!b)return;power=b.dataset.p;energy=0;beep(560,.06);draw()};
  $("#tray").onclick=e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.s==="wind"){energy=Math.min(6,energy+1.2);beep(300+energy*90,.08,"triangle");return}
    if(b.dataset.s==="del"){if(!chain.length){shakeEl(svg);return}chain.pop();beep(300,.08)}
    else{if(chain.length>=10){shakeEl(svg);return}chain.push(b.dataset.s);beep(b.dataset.s==="s"?700:450,.1,"triangle")}
    draw()};
}

/* SECUENCIAS LIBRE: armar un patrón que se repite y suena */
const SNOTE=[261.6,329.6,392,523.3],SWAVE=["triangle","sine","square","sine"];
function secuFree(){
  let set=0,unit=[],playing=false,pos=-1,tk=0;
  const a=area();const o=Math.max(56,Math.floor(Math.min(96,a.h/6,(a.w-40)/7)));
  const e=Math.max(28,Math.floor(Math.min(70,(Math.min(a.w,1300)-80)/(1.3*18+3))));
  stage.innerHTML=`<div class="col" style="--o:${o}px;--e:${e}px;justify-content:center;gap:22px">
    <div class="tbar" id="sets">${SETS.map((s,i)=>`<button class="tbtn" data-set="${i}" aria-label="FIGURAS" style="font-size:34px">${s[0]}</button>`).join("")}</div>
    <div class="opts" id="pal"></div>
    <div class="line" id="un"></div>
    <div class="line" id="strip" style="--e:${Math.round(e*.8)}px"></div>
    <div class="tbar"><button class="tbtn wide say" id="pp" aria-label="TOCAR">▶</button><button class="tbtn" id="bk" aria-label="SACAR">⌫</button><button class="tbtn" id="cl" aria-label="BORRAR TODO">🗑️</button></div></div>`;
  const snd=i=>{try{tone(SWAVE[set],SNOTE[i],AC().currentTime+.02,.35,{a:.005,vol:set===2?.12:.3})}catch(_){}};
  const draw=()=>{
    $("#sets").querySelectorAll("button").forEach(b=>b.classList.toggle("sel",+b.dataset.set===set));
    $("#pal").innerHTML=SETS[set].map((x,i)=>`<button class="opt" data-i="${i}">${x}</button>`).join("");
    $("#un").innerHTML=unit.map(i=>`<span>${SETS[set][i]}</span>`).join("")+(unit.length<6?`<span class="q">+</span>`:"");
    const rep=[...unit,...unit,...unit];
    $("#strip").innerHTML=rep.length?rep.map((i,k)=>`<span class="${k===pos?'now':''}">${SETS[set][i]}</span>`).join(""):`<span class="q">🔁</span>`;
    $("#pp").textContent=playing?"■":"▶";
  };
  const tick=my=>{if(!playing||my!==tk||!unit.length)return;const n=unit.length*3;pos=(pos+1)%n;snd(unit[pos%unit.length]);draw();later(()=>tick(my),420)};
  const stop=()=>{playing=false;pos=-1;draw()};
  draw();
  $("#sets").onclick=ev=>{const b=ev.target.closest("button");if(!b)return;set=+b.dataset.set;beep(520,.05);draw()};
  $("#pal").onclick=ev=>{const b=ev.target.closest(".opt");if(!b)return;const i=+b.dataset.i;snd(i);if(unit.length>=6){shakeEl($("#un"));return}unit.push(i);draw()};
  $("#pp").onclick=()=>{if(playing){stop();return}if(!unit.length){shakeEl($("#un"));return}playing=true;pos=-1;tick(++tk)};
  $("#bk").onclick=()=>{unit.pop();if(!unit.length)stop();else{pos=-1;draw()}};
  $("#cl").onclick=()=>{unit=[];stop()};
}

/* SOMBRAS LIBRE: linterna en una pieza oscura */
const SHNAME={"🔨":"MARTILLO","🔧":"LLAVE INGLESA","✂️":"TIJERA","💡":"LAMPARITA","🔋":"PILA","📱":"CELULAR","🎧":"AURICULARES","📷":"CÁMARA","🔌":"ENCHUFE","🧲":"IMÁN","🔦":"LINTERNA","⏰":"RELOJ","🚲":"BICICLETA","✏️":"LÁPIZ","🔑":"LLAVE","🖱️":"MOUSE","🎸":"GUITARRA","🚗":"AUTO"};
function sombFree(){
  const N=8;const objs=shuffle([...SHI]).slice(0,N);const slots=shuffle([...Array(12).keys()]).slice(0,N);
  const a=area();const sz=Math.max(46,Math.floor(Math.min(100,a.h/6.5,(a.n?a.w:a.w)/9)));
  stage.innerHTML=`<div class="room" id="rm" style="--sz:${sz}px">${objs.map((o,i)=>{const s=slots[i],c=s%4,r=Math.floor(s/4);
      return `<div class="hid" data-n="${SHNAME[o]||""}" style="left:${12+c*25+rnd(-6,6)}%;top:${18+r*32+rnd(-6,6)}%">${o}<small></small></div>`}).join("")}
    <div class="darkness" id="dk"></div><div class="found" id="fc"></div></div>`;
  const rm=$("#rm"),dk=$("#dk");let found=0;
  const fc=()=>{$("#fc").innerHTML=[...Array(N)].map((_,i)=>`<i class="${i<found?'on':''}"></i>`).join("")};fc();
  const light=e=>{const r=rm.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;dk.style.setProperty("--x",x+"px");dk.style.setProperty("--y",y+"px");
    rm.querySelectorAll(".hid:not(.lit)").forEach(h=>{const b=h.getBoundingClientRect(),cx=b.left+b.width/2-r.left,cy=b.top+b.height/2-r.top;
      if(Math.hypot(cx-x,cy-y)<sz*.75){h.classList.add("lit","pop");h.querySelector("small").textContent=h.dataset.n;found++;fc();[700,1000].forEach((f,i)=>later(()=>beep(f,.1),i*80));sayQuiet(h.dataset.n);
        if(found>=N)later(()=>win(sombFree),1500)}})};
  rm.addEventListener("pointermove",light);rm.addEventListener("pointerdown",light);
}

let rz,lastW=innerWidth;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{
  if(Math.abs(innerWidth-lastW)<40)return;lastW=innerWidth;
  if(cur&&lvl!=="free"&&!stage.querySelector(".win"))start(cur,lvl)},250)});
home();
